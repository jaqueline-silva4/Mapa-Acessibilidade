<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acessa+ é uma plataforma para encontrar instituições acessíveis e consultar recursos de acessibilidade."/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <title>Acessa+</title>
    <script>
      // Aplica o tema antes da primeira renderização, evitando o "flash" de tema claro.
      (function () {
        var tema = null;
        try {
          tema = window.localStorage.getItem('tema');
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'escuro'
              : 'claro';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
