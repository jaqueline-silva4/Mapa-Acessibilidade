services:
  mysql:
    image: mysql:8.0
    container_name: mapa-acessibilidade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mapa_acessibilidade
    ports:
      - "3305:3306"
    volumes:
      - mysql_acessibilidade_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_acessibilidade_data:
